# filesrv - standalone Samba file server (reference configuration)
#
# Documented simplification: this server is NOT a domain member. Joining a
# Samba member server to the DC is fragile in ephemeral containers, so filesrv
# runs standalone (security = user) and mirrors the domain accounts locally.
# The usernames match the domain so the scenario reads the same; the trust
# boundary is the share ACL below.
#
# Accounts provisioned by the entrypoint:
#   fileshare / F1leShare!2026   (backup service account - the only 'critical' principal)
#   jsmith    / Summer2026!      (mirrors domain user)
#   mchen     / Welcome123!      (mirrors domain user)
#   svc_web   / Web#Svc2026!     (web tier service account; exists so phase 4
#                                 demonstrates authenticated-but-limited access:
#                                 valid login, public read, critical DENIED)
#
# vfs_full_audit logs every listed operation to syslog (local7), which rsyslog
# writes to /var/log/samba/audit.log:
#   smbd_audit: <user>|<ip>|<share>|<op>|<result>|<path>

[global]
   server role = standalone server
   security = user
   map to guest = Bad User
   workgroup = LAB
   server string = filesrv - SIMULATED file server (lab only)
   log file = /var/log/samba/log.%m
   log level = 1
   max log size = 5000
   load printers = no
   disable spoolss = yes

   # Audit every open/write/delete on every share (the video's file-access
   # event log analog; SIEM rule 100920 keys on 'critical' reads).
   vfs objects = full_audit
   full_audit:prefix = %u|%I|%S
   full_audit:success = connect, disconnect, opendir, mkdir, rmdir, open, close, unlink, rename, pwrite
   full_audit:failure = none
   full_audit:facility = local7
   full_audit:priority = notice

[public]
   comment = SIMULATED general-purpose share (contains the old-runbook.txt decoy)
   path = /srv/samba/public
   browseable = yes
   writable = yes
   guest ok = yes
   create mask = 0666
   directory mask = 0777

[critical]
   comment = SIMULATED sensitive share - fileshare account only (board notes, financials, "passport scans")
   path = /srv/samba/critical
   browseable = yes
   writable = yes
   guest ok = no
   valid users = fileshare
   create mask = 0660
   directory mask = 0770
