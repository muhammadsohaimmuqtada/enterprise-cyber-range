#!/usr/sbin/nft -f
# =============================================================================
# enterprise-cyber-range - perimeter + internal firewall (reference configuration)
# =============================================================================
# Loaded by the 'fw' container at boot:      nft -f /fw/nftables.conf
# Reload after edits (no restart needed):    docker exec fw nft -f /fw/nftables.conf
#
# FIRST MATCH WINS - rules are evaluated top to bottom; the first rule whose
# matchers match decides the packet's fate. The ordering below is load-bearing.
# If nothing matches, the final rule drops: that is the IMPLICIT DENY.
#
# Segments (see docs/ips-vlans.md):
#   attack-net  172.31.100.0/24   outside: attacker + simulated ISP hop
#   dmz         10.10.10.0/24     web01 10.10.10.5
#   users       10.10.20.0/24     ws1 10.10.20.5, ws2 10.10.20.6
#   servers     10.10.30.0/24     dc01 10.10.30.10, filesrv 10.10.30.11, siem .20
#
# Log prefixes (grep targets for the blue team):
#   FW-EDGE-DENY     attack-net tried something other than the public web app
#   FW-LATERAL-DENY  an east-west move the segmentation rules forbid
#   FW-EGRESS-DENY   an internal host tried to reach the external segment
#   FW-INPUT-DENY    traffic addressed to the firewall itself
# =============================================================================

flush ruleset

table inet filter {

    chain input {
        type filter hook input priority 0; policy accept;

        counter comment "input: traffic addressed to the firewall itself"

        iifname "lo" counter accept comment "FW-I1 loopback"
        ct state established,related counter accept comment "FW-I2 replies to our own flows"
        ct state invalid counter drop comment "FW-I3 invalid"
        ip protocol icmp limit rate 5/second counter accept comment "FW-I4 icmp rate-limited"
        ip saddr 172.31.100.0/24 tcp dport 22 counter accept comment "FW-I5 admin ssh from attack-net (no sshd ships in the reference image; this documents where admin access attaches)"
        limit rate 10/second log prefix "FW-INPUT-DENY: " counter comment "FW-I6 input deny log"
        counter drop comment "FW-I7 implicit deny on input"
    }

    chain forward {
        type filter hook forward priority 0; policy accept;

        counter comment "forward: packets routed between the four segments"

        # --- STATEFUL: the workhorse of modern networks --------------------
        ct state established,related counter accept comment "FW-01 stateful: replies to already-allowed flows"
        ct state invalid counter drop comment "FW-02 invalid state"

        # --- ICMP, rate limited --------------------------------------------
        ip protocol icmp limit rate 5/second counter accept comment "FW-03 icmp (rate-limited) for troubleshooting"

        # --- PERIMETER: attack-net -> dmz (north-south inbound) -------------
        ip saddr 172.31.100.0/24 ip daddr 10.10.10.5 tcp dport { 80, 443 } ct state new counter accept comment "FW-04 edge: only the public web app is exposed (DNAT'd from 172.31.100.1, see table nat)"
        ip saddr 172.31.100.0/24 limit rate 10/second log prefix "FW-EDGE-DENY: " counter comment "FW-05 edge deny log (perimeter)"
        ip saddr 172.31.100.0/24 counter drop comment "FW-06 edge: everything else from the outside is dropped"

        # --- DMZ -> SERVERS (east-west; the video's 'blocked path') --------
        ip saddr 10.10.10.0/24 ip daddr 10.10.30.11 tcp dport 445 counter accept comment "FW-07 dmz may speak SMB to filesrv ONLY (phase 4 pivots through this rule)"
        ip saddr 10.10.10.0/24 ip daddr 10.10.30.10 tcp dport { 88, 464 } counter accept comment "FW-08 dmz may speak Kerberos to the DC"
        ip saddr 10.10.10.0/24 ip daddr 10.10.30.10 udp dport 123 counter accept comment "FW-09 dmz may sync time with the DC"
        ip saddr 10.10.10.0/24 ip daddr 10.10.30.0/24 limit rate 10/second log prefix "FW-LATERAL-DENY: " counter comment "FW-10 lateral deny log (dmz->servers)"
        ip saddr 10.10.10.0/24 ip daddr 10.10.30.0/24 counter drop comment "FW-11 the blocked path: a compromised DMZ host cannot roam the server segment"

        # --- USERS -> SERVERS (east-west; the video's workstation rule) ----
        ip saddr 10.10.20.0/24 ip daddr 10.10.30.11 tcp dport 445 counter accept comment "FW-12 'workstation may speak file sharing to this one server'"
        ip saddr 10.10.20.0/24 ip daddr 10.10.30.10 tcp dport { 53, 88, 135, 389, 445, 464 } counter accept comment "FW-13 AD services to the DC: DNS, Kerberos, RPC endpoint mapper, LDAP, SMB, kpasswd (tcp/53 + 389 added so the workstation domain join works)"
        ip saddr 10.10.20.0/24 ip daddr 10.10.30.10 udp dport { 53, 88, 389, 464 } counter accept comment "FW-14 AD services UDP: DNS, Kerberos, CLDAP, kpasswd"
        ip saddr 10.10.20.0/24 ip daddr 10.10.30.0/24 limit rate 10/second log prefix "FW-LATERAL-DENY: " counter comment "FW-15 lateral deny log (users->servers)"
        ip saddr 10.10.20.0/24 ip daddr 10.10.30.0/24 counter drop comment "FW-16 workstations cannot roam the server segment either"

        # --- USERS -> DMZ (east-west) ---------------------------------------
        ip saddr 10.10.20.0/24 ip daddr 10.10.10.0/24 tcp dport 443 counter accept comment "FW-17 users reach the intranet portal over HTTPS"
        ip saddr 10.10.20.0/24 ip daddr 10.10.10.0/24 limit rate 10/second log prefix "FW-LATERAL-DENY: " counter comment "FW-18 lateral deny log (users->dmz)"
        ip saddr 10.10.20.0/24 ip daddr 10.10.10.0/24 counter drop comment "FW-19 users cannot touch the DMZ otherwise"

        # --- EGRESS to attack-net (north-south outbound) --------------------
        ip saddr 10.10.10.5 ip daddr 172.31.100.0/24 tcp dport 443 counter accept comment "FW-20 egress: web01 HTTPS to the external segment (pre-authorized phase-6 exfil path)"
        ip saddr { 10.10.10.0/24, 10.10.20.0/24 } ip daddr 172.31.100.0/24 limit rate 10/second log prefix "FW-EGRESS-DENY: " counter comment "FW-21 egress deny log"
        ip saddr { 10.10.10.0/24, 10.10.20.0/24 } ip daddr 172.31.100.0/24 counter drop comment "FW-22 egress filtering: internal hosts do not talk to the outside"

        counter drop comment "FW-23 IMPLICIT DENY - if nothing above explicitly allowed it, it is blocked"
    }

    chain output {
        type filter hook output priority 0; policy accept;
        counter comment "output: traffic originated by the firewall itself"
    }
}

table inet nat {
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        ip saddr 172.31.100.0/24 ip daddr 172.31.100.1 tcp dport 80  counter dnat ip to 10.10.10.5:80  comment "FW-N1 edge port-forward: HTTP -> web01 (phase 1 target)"
        ip saddr 172.31.100.0/24 ip daddr 172.31.100.1 tcp dport 443 counter dnat ip to 10.10.10.5:443 comment "FW-N2 edge port-forward: HTTPS -> web01"
    }
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
    }
}
